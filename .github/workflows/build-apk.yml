name: HPLeila CI and APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Configure persistent release signing when available
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HPLEILA_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.HPLEILA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HPLEILA_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.HPLEILA_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64}" && -n "${KEY_ALIAS}" && -n "${KEY_PASSWORD}" && -n "${STORE_PASSWORD}" ]]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > android/app/hpleila-release.jks
            cat > android/key.properties <<EOF
          storeFile=hpleila-release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Persistent signing secrets are not configured. A debug APK will be uploaded for testing only; it cannot update an installation signed with another key."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        run: flutter build apk --release

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hpleila-signed-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build debug APK for functional testing
        if: steps.signing.outputs.configured != 'true'
        run: flutter build apk --debug

      - name: Upload debug APK (not for in-place upgrade)
        if: steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hpleila-debug-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
