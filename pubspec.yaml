publish_to: 'none'
version: 1.9.5+22

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  workmanager: ^0.5.2
  shamsi_date: ^1.0.2
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.2
  share_plus: ^10.1.4
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/Amiri-Regular.ttf
    - assets/leila-logo.svg
